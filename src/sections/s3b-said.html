<style>
/* ---------- S3b · "Lo que no se dice sí se mide." · botella bajo foco + fijaciones ---------- */
.ng-said{min-height:100vh;min-height:100svh;display:flex;align-items:center;padding:clamp(80px,9vw,140px) 0;background:#000}
.ng-said__beam{position:absolute;left:-10%;top:-20%;width:60%;height:130%;z-index:-1;pointer-events:none;transform-origin:0 0;
  background:linear-gradient(118deg,rgba(242,243,240,.13) 0%,rgba(242,243,240,.05) 32%,rgba(242,243,240,0) 58%);
  clip-path:polygon(0 0,38% 0,100% 100%,62% 100%);animation:ng-beam 9s ease-in-out infinite alternate}
@keyframes ng-beam{from{transform:rotate(-2deg)}to{transform:rotate(2.5deg)}}
.ng-said__grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;align-items:center}
.ng-said__copy{grid-column:1/span 6}
.ng-said__t{font-size:clamp(66px,9.6vw,184px);line-height:.88}
.ng-said__brand{margin-top:clamp(20px,2.4vw,32px);font:500 clamp(14px,1.3vw,20px)/1 var(--ng-mono);letter-spacing:.14em;color:var(--ng-lime);text-shadow:0 0 14px rgba(200,255,0,.55)}
.ng-said__p{margin-top:clamp(28px,3vw,44px);color:var(--ng-tx2);max-width:44ch}
.ng-said__stage{grid-column:8/span 5;display:flex;justify-content:center}
.ng-said__fig{position:relative;height:min(86vh,820px);aspect-ratio:520/1350;margin:0}
.ng-said__fig .ng-media{position:absolute;inset:0;border-radius:0;background:#000}
.ng-said__fix{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.ng-said__fix circle{fill:none;stroke:var(--ng-lime);stroke-width:1.5;vector-effect:non-scaling-stroke}
@media (max-width:1023px){
  .ng-said__copy,.ng-said__stage{grid-column:1/-1}
  .ng-said__fig{height:min(70svh,600px)}
  .ng-said__beam{width:110%}
}
@media (prefers-reduced-motion:reduce){.ng-said__beam{animation:none}}
</style>

<section class="ng-sec ng-said" aria-labelledby="ng-said-title" data-ng="said">
  <div class="ng-said__beam" aria-hidden="true"></div>
  <div class="ng-wrap">
    <div class="ng-said__grid">
      <div class="ng-said__copy">
        <p class="ng-mono ng-eyebrow" style="margin-bottom:clamp(18px,2vw,28px)">{{n}} · Señal no consciente</p>
        <h2 class="ng-h2 ng-said__t" id="ng-said-title" data-ng-split>Lo que<br>no se dice<br><span class="ng-hl">sí se mide.</span></h2>
        <p class="ng-said__brand" aria-hidden="true">NEUROGENOMIC</p>
        <p class="ng-said__p" data-ng-reveal>Una encuesta recoge lo que la persona cree que siente. La mirada, el gesto y la piel registran lo que realmente pasa, antes de que lo pueda explicar.</p>
      </div>
      <div class="ng-said__stage">
        <figure class="ng-said__fig">
          <div class="ng-media" data-ph="/img/ref-bottle">{{img:bottle}}</div>
          <svg class="ng-said__fix" viewBox="0 0 520 1350" preserveAspectRatio="none" aria-hidden="true">
            <circle cx="230" cy="650" r="34"/><circle cx="265" cy="757" r="36"/><circle cx="202" cy="830" r="44"/><circle cx="266" cy="965" r="34"/><circle cx="225" cy="1015" r="36"/>
          </svg>
        </figure>
      </div>
    </div>
  </div>
</section>

<script>
NG.boot('[data-ng="said"]', function (sec) {
  var fig = sec.querySelector('.ng-said__fig'), rings = [].slice.call(sec.querySelectorAll('.ng-said__fix circle'));
  NG.reveals(sec);
  NG.ready().then(function (gsap) {
    if (!gsap || NG.rm) return;
    gsap.fromTo(fig, { autoAlpha: 0, y: 60 }, { autoAlpha: 1, y: 0, duration: 1.6, ease: 'expo.out', scrollTrigger: { trigger: fig, start: 'top 85%', once: true } });
    // Fijaciones que "laten" en orden, como una lectura en vivo
    rings.forEach(function (c) { gsap.set(c, { svgOrigin: c.getAttribute('cx') + ' ' + c.getAttribute('cy'), scale: .4, autoAlpha: 0 }); });
    var tl = gsap.timeline({ repeat: -1, repeatDelay: .6, paused: true });
    rings.forEach(function (c, i) {
      tl.to(c, { scale: 1.5, autoAlpha: 1, duration: .35, ease: 'power2.out' }, i * .45)
        .to(c, { scale: 2.1, autoAlpha: 0, duration: .7, ease: 'power1.in' }, i * .45 + .35);
    });
    ScrollTrigger.create({ trigger: sec, start: 'top 80%', end: 'bottom 20%', onToggle: function (s) { s.isActive ? tl.play() : tl.pause(); } });
  });
});
</script>
