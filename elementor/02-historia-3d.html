     Incluye tokens + núcleo NG (idempotentes: pueden repetirse en varios bloques).
     Nota: Capa 3D fija (Three.js) «de la neurona al consumidor» + riel de capítulos + botón para pausar. Va una sola vez, antes del hero. Sin WebGL usa img/story/cap-*.webp.
     Imágenes: reemplaza /img/ por la URL de la Biblioteca de medios. -->

:where(.ng-sec,.ng-nav,.ng-mast,.ng-foot,.ng-menu,.ng-pre) :is(h1,h2,h3,h4,h5,h6){font-size:revert;font-weight:revert;line-height:revert;font-family:revert;color:revert}

.ng-btn{
--_bg:transparent;--_fg:var(--ng-tx);--_bd:var(--ng-line2);
position:relative;display:inline-flex;align-items:center;justify-content:center;gap:12px;
min-height:48px;padding:0 22px;border-radius:var(--ng-r);border:1px solid var(--_bd);

.ng-btn{--_bd:rgba(255,255,255,.12)}

.ng-btn--volt{--_bg:var(--ng-lime);--_fg:#0A0B0D;--_bd:var(--ng-lime);font-weight:600;box-shadow:0 0 0 0 rgba(200,255,0,0),0 10px 34px -12px rgba(200,255,0,.55);transition:background .35s var(--ng-ease),border-color .35s var(--ng-ease),color .35s var(--ng-ease),box-shadow .45s var(--ng-ease)}

.ng-marks>i::after{bottom:10px;right:10px;border-bottom-width:1px;border-right-width:1px}

<script>
/* ==========================================================
   NEUROGENOMIC · Núcleo JS compartido (window.NG)
   Idempotente: puede venir repetido en varios bloques Elementor.
   Carga GSAP + ScrollTrigger (cdnjs) y Lenis (jsDelivr) una sola vez.
   ========================================================== */
(function () {
  if (window.NG) return;
  var NG = (window.NG = {});
  var d = document, de = d.documentElement;
  de.classList.add('ng-js');

  var mq = function (q) { return window.matchMedia ? window.matchMedia(q).matches : false; };

  NG.fine = mq('(hover: hover) and (pointer: fine)');
  NG.edit = function () { return d.body && d.body.classList.contains('elementor-editor-active'); };
  NG.lerp = function (a, b, t) { return a + (b - a) * t; };
  NG.clamp = function (v, a, b) { return Math.min(b, Math.max(a, v)); };

  var CDN = {
    gsap: 'https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js',
    st: 'https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js',
    lenis: 'https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js',
    three: 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'
  };
  function load(src) {
    return new Promise(function (res, rej) {
      var ex = d.querySelector('script[src="' + src + '"]');
      if (ex) {
        if (ex.getAttribute('data-ng-loaded')) return res();
        ex.addEventListener('load', function () { res(); });
        ex.addEventListener('error', rej);
        return;
      }

      s.src = src; s.async = true; s.crossOrigin = 'anonymous';
      s.onload = function () { s.setAttribute('data-ng-loaded', '1'); res(); };
      s.onerror = rej;
      d.head.appendChild(s);
    });

  NG.load = load; NG.CDN = CDN;

  /* --- Carga de librerías + Lenis ------------------------------------ */
  var readyP = null;
  NG.ready = function () {
    if (readyP) return readyP;
    readyP = (window.gsap ? Promise.resolve() : load(CDN.gsap))
      .then(function () { return window.ScrollTrigger ? null : load(CDN.st); })
      .then(function () {
        gsap.registerPlugin(ScrollTrigger);
        gsap.defaults({ ease: 'power3.out', duration: 0.9 });
        if (NG.rm || NG.edit()) return;
        return (window.Lenis ? Promise.resolve() : load(CDN.lenis)).then(initLenis, function () {});
      })
      .then(function () { return window.gsap; })
      .catch(function () { de.classList.add('ng-nolib'); return null; });
    return readyP;
  };
  function initLenis() {
    if (NG.lenis || !window.Lenis) return;
    var lenis = (NG.lenis = new Lenis({ duration: 1.15, easing: function (t) { return Math.min(1, 1.001 - Math.pow(2, -10 * t)); }, smoothWheel: true }));
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add(function (t) { lenis.raf(t * 1000); });

  }
  NG.scrollTo = function (target) {
    var el = typeof target === 'string' ? d.querySelector(target) : target;
    if (!el) return;
    if (NG.lenis) NG.lenis.scrollTo(el, { offset: 0, duration: 1.4 });
    else el.scrollIntoView({ behavior: NG.rm ? 'auto' : 'smooth' });
  };

  /* --- Arranque con guardas data-init y múltiples entradas ----------- */
  NG.boot = function (selector, init) {
    var run = function () {
      var els = d.querySelectorAll(selector);
      for (var i = 0; i < els.length; i++) {
        var el = els[i];
        if (el.getAttribute('data-init')) continue;
        el.setAttribute('data-init', '1');
        try { init(el); } catch (e) { if (window.console) console.error('[NG]', selector, e); }
      }
    };
    if (d.readyState !== 'loading') run(); else d.addEventListener('DOMContentLoaded', run);
    window.addEventListener('load', run);
    var hook = function () {
      if (window.elementorFrontend && elementorFrontend.hooks) elementorFrontend.hooks.addAction('frontend/element_ready/global', run);
    };
    if (window.elementorFrontend && window.elementorFrontend.hooks) hook();
    else window.addEventListener('elementor/frontend/init', hook);
  };

  /* --- Preloader → secciones esperan este evento --------------------- */
  NG.afterPreload = function (cb) {
    if (!de.classList.contains('ng-pre-on') || de.classList.contains('ng-pre-done')) return cb();
    window.addEventListener('ng:preloaded', function f() { window.removeEventListener('ng:preloaded', f); cb(); });
  };

  /* --- Split de texto accesible (copia sr + spans aria-hidden) ------- */
  NG.split = function (el, mode) {
    if (el._ngSplit) return el._ngSplit;
    var text = el.textContent.replace(/\s+/g, ' ').trim();
    var out = [];
    el.setAttribute('aria-label', text);
    var frag = d.createDocumentFragment();
    var sr = d.createElement('span'); sr.className = 'ng-sr'; sr.textContent = text; frag.appendChild(sr);
    var vis = d.createElement('span'); vis.setAttribute('aria-hidden', 'true');
    // conserva <br> y <em> simples: trabajamos sobre los nodos hijos
    var walk = function (node, parent) {
      [].slice.call(node.childNodes).forEach(function (n) {
        if (n.nodeType === 3) {
          var parts = n.textContent.split(/(\s+)/);
          parts.forEach(function (p) {
            if (!p) return;
            if (/^\s+$/.test(p)) { parent.appendChild(d.createTextNode(' ')); return; }
            if (mode === 'chars') {
              var w = d.createElement('span'); w.style.display = 'inline-block'; w.style.whiteSpace = 'nowrap';
              p.split('').forEach(function (c) { var s = d.createElement('span'); s.textContent = c; s.style.display = 'inline-block'; w.appendChild(s); out.push(s); });
              parent.appendChild(w);
            } else {
              var m = d.createElement('span'); m.className = 'ng-w';
              var i = d.createElement('span'); i.textContent = p; m.appendChild(i); parent.appendChild(m); out.push(i);
            }
          });

          if (n.tagName === 'BR') { parent.appendChild(d.createElement('br')); return; }
          var c = n.cloneNode(false); c.removeAttribute('id'); parent.appendChild(c); walk(n, c);

    frag.appendChild(vis);
    el.textContent = ''; el.appendChild(frag);
    el.removeAttribute('aria-label');
    el._ngSplit = out;
    return out;
  };

  /* --- Visibilidad + bucles rAF que se pausan fuera de viewport ------ */
  NG.vis = function (el, onIn, onOut, margin) {
    if (!('IntersectionObserver' in window)) { onIn && onIn(); return; }
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) onIn && onIn(e); else onOut && onOut(e); });
    }, { rootMargin: margin || '0px' });
    io.observe(el);
    return io;
  };
  NG.loop = function (el, fn) {
    var on = false, raf = 0, last = 0, docVis = !d.hidden;
    var tick = function (t) {
      raf = 0;
      if (!on || !docVis) return;
      var dt = last ? Math.min(64, t - last) : 16; last = t;
      fn(t, dt);
      raf = requestAnimationFrame(tick);
    };
    var start = function () { if (!raf && on && docVis) { last = 0; raf = requestAnimationFrame(tick); } };
    NG.vis(el, function () { on = true; start(); }, function () { on = false; }, '80px');
    d.addEventListener('visibilitychange', function () { docVis = !d.hidden; start(); });
    return { kick: start };
  };

  /* --- Canvas con DPR y ResizeObserver ------------------------------ */
  NG.canvas = function (cv, onResize) {
    var ctx = cv.getContext('2d');
    var o = { cv: cv, ctx: ctx, w: 0, h: 0, dpr: 1 };
    var fit = function () {
      var r = cv.getBoundingClientRect();
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
      if (w === o.w && h === o.h && dpr === o.dpr) return;
      o.w = w; o.h = h; o.dpr = dpr;
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      onResize && onResize(o);
    };
    fit();
    if ('ResizeObserver' in window) new ResizeObserver(fit).observe(cv); else window.addEventListener('resize', fit);
    return o;
  };

  /* --- Heatmap térmico pixelado (estilo campaña: lima → amarillo → naranja → rojo) ---
     pts: [x, y, radio, peso] normalizados 0–1. opts.cell = tamaño de celda en px CSS. */
  var RAMP = [[0, [200, 255, 0, 0]], [0.16, [200, 255, 0, 0.45]], [0.4, [200, 255, 0, 0.85]],
              [0.62, [255, 214, 0, 0.92]], [0.8, [255, 122, 0, 0.95]], [1, [255, 42, 0, 1]]];
  NG.thermal = function (v) {
    v = NG.clamp(v, 0, 1);
    for (var k = 1; k < RAMP.length; k++) if (v <= RAMP[k][0]) {
      var lo = RAMP[k - 1], hi = RAMP[k], t = (v - lo[0]) / (hi[0] - lo[0]), c = [];
      for (var j = 0; j < 4; j++) c[j] = lo[1][j] + (hi[1][j] - lo[1][j]) * t;
      return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + c[3].toFixed(3) + ')';
    }
    return 'rgba(255,42,0,1)';
  };
  NG.heat = function (cv, pts, opts) {
    opts = opts || {};
    var r = cv.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(1, r.width), h = Math.max(1, r.height);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    var base = Math.min(w, h), cell = opts.cell || Math.max(5, Math.round(base / 46)), gap = Math.max(1, cell * .18);
    var gain = opts.gain || 1;
    // brillo suave bajo los píxeles
    pts.forEach(function (p) {
      var rad = (p[2] || .12) * base * 1.25, x = p[0] * w, y = p[1] * h;
      var g = ctx.createRadialGradient(x, y, 0, x, y, rad);
      g.addColorStop(0, 'rgba(200,255,0,' + (.22 * (p[3] == null ? 1 : p[3])) + ')'); g.addColorStop(1, 'rgba(200,255,0,0)');
      ctx.fillStyle = g; ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    });
    for (var y = 0; y < h; y += cell) for (var x = 0; x < w; x += cell) {
      var cx = x + cell / 2, cy = y + cell / 2, v = 0;
      for (var i = 0; i < pts.length; i++) {
        var p = pts[i], s = (p[2] || .12) * base, dx = cx - p[0] * w, dy = cy - p[1] * h;
        v += (p[3] == null ? 1 : p[3]) * Math.exp(-(dx * dx + dy * dy) / (2 * s * s * .45));
      }
      v *= gain;
      if (v < .08) continue;
      ctx.fillStyle = NG.thermal(Math.min(1, v));
      ctx.fillRect(x + gap / 2, y + gap / 2, cell - gap, cell - gap);
    }
  };

  /* --- Contador ----------------------------------------------------- */
  NG.count = function (el, to, o) {
    o = o || {};
    var dec = o.dec || 0, fmt = function (v) { return (o.pre || '') + v.toFixed(dec) + (o.suf || ''); };
    if (NG.rm || !window.gsap) { el.textContent = fmt(to); o.done && o.done(); return; }
    var st = { v: o.from || 0 };
    el.textContent = fmt(st.v);
    return gsap.to(st, { v: to, duration: o.dur || 1.8, ease: o.ease || 'expo.out', delay: o.delay || 0,
      onUpdate: function () { el.textContent = fmt(st.v); o.update && o.update(st.v / to); },
      onComplete: function () { el.textContent = fmt(to); o.done && o.done(); } });
  };

  /* --- Reveals genéricos dentro de una sección ----------------------- */
  NG.reveals = function (root) {
    if (!window.gsap || NG.rm) return;
    root.querySelectorAll('[data-ng-split]').forEach(function (el) {
      var w = NG.split(el);
      gsap.from(w, { yPercent: 110, duration: 1.1, ease: 'expo.out', stagger: 0.05,
        scrollTrigger: { trigger: el, start: 'top 88%', once: true } });
    });
    root.querySelectorAll('[data-ng-reveal]').forEach(function (el) {
      gsap.from(el, { autoAlpha: 0, y: 28, duration: 1, ease: 'power3.out', delay: parseFloat(el.getAttribute('data-ng-reveal')) || 0,
        scrollTrigger: { trigger: el, start: 'top 90%', once: true } });
    });
    if (root.hasAttribute('data-ng-bg')) {
      gsap.timeline({ scrollTrigger: { trigger: root, start: 'top 75%', end: 'bottom 25%', scrub: true } })
        .fromTo(root, { '--ng-bgo': 0 }, { '--ng-bgo': 1, ease: 'none', duration: 0.25 })
        .to(root, { '--ng-bgo': 1, duration: 0.5 })
        .to(root, { '--ng-bgo': 0, ease: 'none', duration: 0.25 });
    }
  };

  /* --- Botones magnéticos ------------------------------------------- */
  /* Capítulos: el texto (y sus chips o lista) entra cuando la tarjeta aparece en pantalla.
     Usa IntersectionObserver, no posiciones calculadas: funciona aunque Elementor, el tema o
     las imágenes cambien la altura de la página después de cargar. Cada capítulo se anima solo. */
  NG.chReveal = function (sec) {
    var t = sec.querySelector('[data-ng-chtxt]');
    if (!t) return;
    NG.ready().then(function (gsap) {
      if (!gsap || NG.rm || !('IntersectionObserver' in window)) return;
      var items = [].slice.call(t.children), subs = t.querySelectorAll('.ng-ch__chips li,.ng-ch__list li,.ng-ch__ctas > *');
      gsap.set(items, { autoAlpha: 0, y: 26 });
      if (subs.length) gsap.set(subs, { autoAlpha: 0, y: 12 });
      var done = false, io, safety;
      var play = function () {
        if (done) return; done = true;
        if (io) io.disconnect(); clearTimeout(safety);
        var tl = gsap.timeline();
        tl.to(items, { autoAlpha: 1, y: 0, duration: 1.1, ease: 'expo.out', stagger: .08 });
        if (subs.length) tl.to(subs, { autoAlpha: 1, y: 0, duration: .7, ease: 'back.out(1.6)', stagger: .06 }, .35);
      };
      io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) play(); }); }, { rootMargin: '0px 0px -18% 0px' });
      io.observe(t);
      // Red de seguridad: si la tarjeta ya está a la vista y el observador no avisó, se muestra igual
      safety = setTimeout(function () { var r = t.getBoundingClientRect(); if (r.top < innerHeight && r.bottom > 0) play(); }, 2500);
    });
  };

  NG.magnet = function (el, k) {
    if (!NG.fine || NG.rm || el._ngMag) return;
    el._ngMag = 1; k = k || 0.3;
    var inner = el.querySelector('.ng-btn__t') || el;
    el.addEventListener('pointermove', function (e) {
      var r = el.getBoundingClientRect();
      var x = (e.clientX - r.left - r.width / 2) * k, y = (e.clientY - r.top - r.height / 2) * k;
      el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
      if (inner !== el) inner.style.transform = 'translate(' + x * 0.35 + 'px,' + y * 0.35 + 'px)';
    });
    el.addEventListener('pointerleave', function () {
      el.style.transition = 'transform .6s cubic-bezier(.16,1,.3,1)';
      el.style.transform = ''; if (inner !== el) { inner.style.transition = el.style.transition; inner.style.transform = ''; }
      setTimeout(function () { el.style.transition = ''; inner.style.transition = ''; }, 600);
    });
  };

  /* --- Anclas internas con Lenis ------------------------------------ */
  d.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href*="#"]');
    if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey) return;
    var url = new URL(a.href, location.href);
    if (url.pathname !== location.pathname || !url.hash || url.hash.length < 2) return;
    var t = d.getElementById(decodeURIComponent(url.hash.slice(1)));
    if (!t) return;
    e.preventDefault();
    NG.scrollTo(t);
    if (t.tabIndex < 0 && !/^(A|BUTTON|INPUT|SELECT|TEXTAREA)$/.test(t.tagName)) t.setAttribute('tabindex', '-1');
    t.focus({ preventScroll: true });
    history.replaceState(null, '', url.hash);
  });
})();
</script>

<script>
NG.boot('[data-ng="story"]', function (layer) {
  var d = document, de = d.documentElement;
  de.classList.add('ng-has-story');
  var cv = layer.querySelector('.ng-story__cv'), glow = layer.querySelector('.ng-story__glow'), lblBox = layer.querySelector('.ng-story__lbls');
  var rail = d.querySelector('.ng-rail'), railA = rail ? [].slice.call(rail.querySelectorAll('a')) : [];
  var motionBtn = d.querySelector('.ng-motion');
  var mobile = !NG.fine || window.innerWidth < 768;
  var chs = function () { return [].slice.call(d.querySelectorAll('[data-ng-ch]')); };
  var hero = d.querySelector('.ng-hero');

  /* ---------- Estado de scroll: etapa (0–4), foco narrativo y lado del texto ---------- */
  var S = { stage: 0, focus: 1, side: 1, cur: 0, text: true, end: 0 };
  var measure = function () {
    var vh = innerHeight, list = chs(), st = 0, best = 0, side = 0, cur = 0;
    list.forEach(function (el) {
      var k = +el.getAttribute('data-ng-ch'), r = el.getBoundingClientRect();
      if (k >= 2) st += NG.clamp((vh * 1.05 - r.top) / (vh * .6), 0, 1); // la figura ya está formada cuando el capítulo entra en pantalla
      var vis = Math.max(0, Math.min(r.bottom, vh) - Math.max(r.top, 0)) / vh;
      if (vis > best) { best = vis; side = el.getAttribute('data-side') === 'right' ? -1 : 1; }
      if (r.top < vh * .6) cur = k;
    });
    if (hero) {
      var hr = hero.getBoundingClientRect(), hv = Math.max(0, Math.min(hr.bottom, vh) - Math.max(hr.top, 0)) / vh;
      if (hv > best) { best = hv; side = 1.55; } // hero: la neurona se corre a la derecha y deja libre el titular
    }
    var txt = false;
    [].forEach.call(d.querySelectorAll('[data-ng-chtxt],.ng-hero__content'), function (t) { var r = t.getBoundingClientRect(); if (r.top < vh * .85 && r.bottom > vh * .15) txt = true; });
    // Fundido final: al dejar el capítulo 05 la escena se apaga y entra la propuesta comercial
    var last = list[list.length - 1], end = 0;
    if (last) { var lr = last.getBoundingClientRect(); end = NG.clamp((vh * .75 - lr.bottom) / (vh * .55), 0, 1); }
    S.stage = Math.min(4, st); S.focus = best; S.side = side; S.cur = cur; S.text = txt; S.end = end;
  };

  /* ---------- Riel y botón de movimiento ---------- */
  var paused = NG.rm;
  try { if (localStorage.getItem('ng3d-paused') === '1') paused = true; } catch (e) {}
  var setPaused = function (p) {
    paused = p;
    if (motionBtn) { motionBtn.setAttribute('aria-pressed', p); motionBtn.lastElementChild.textContent = p ? 'Reanudar animación 3D' : 'Pausar animación 3D'; }
    try { localStorage.setItem('ng3d-paused', p ? '1' : '0'); } catch (e) {}
    kick();
  };
  if (motionBtn) motionBtn.addEventListener('click', function () { setPaused(!paused); });
  railA.forEach(function (a) { a.addEventListener('click', function (e) { var t = d.querySelector(a.getAttribute('href')); if (t) { e.preventDefault(); NG.scrollTo(t); t.setAttribute('tabindex', '-1'); t.focus({ preventScroll: true }); } }); });
  var ui = function () {
    var on = S.cur > 0 && S.end < .9;
    if (rail) { rail.classList.toggle('is-on', on); rail.classList.toggle('is-story', S.focus > .35); }
    railA.forEach(function (a, i) { var c = Math.round(S.stage) === i && on; a.classList.toggle('is-cur', c); if (c) a.setAttribute('aria-current', 'step'); else a.removeAttribute('aria-current'); });
    if (motionBtn) motionBtn.classList.toggle('is-on', S.focus > .3 && S.end < .9);
  };

  /* ---------- Atmósfera CSS (también es el respaldo sin WebGL) ---------- */
  var PAL = [[[40, 70, 220], [110, 60, 220]], [[20, 140, 230], [60, 80, 220]], [[30, 60, 200], [20, 170, 230]], [[110, 60, 220], [200, 150, 60]], [[20, 160, 230], [120, 80, 230]]];
  var atm = function (s) {
    var i = Math.min(3, Math.floor(s)), f = s - i, a = PAL[i], b = PAL[i + 1] || PAL[i];
    var mix = function (x, y) { return x.map(function (v, k) { return Math.round(v + (y[k] - v) * f); }).join(','); };
    glow.style.setProperty('--g1', 'rgba(' + mix(a[0], b[0]) + ',.30)');
    glow.style.setProperty('--g2', 'rgba(' + mix(a[1], b[1]) + ',.20)');
    glow.style.setProperty('--gx', (50 + S.side * 14) + '%');
  };

  var kick = function () {};
  var cta = d.querySelector('.ng-cta .ng-wrap');
  var fade = function () {
    layer.style.opacity = (1 - S.end).toFixed(3);
    if (cta && !NG.rm) { cta.style.opacity = (.15 + .85 * NG.clamp(S.end * 1.4, 0, 1)).toFixed(3); cta.style.transform = 'translateY(' + ((1 - NG.clamp(S.end * 1.4, 0, 1)) * 36).toFixed(1) + 'px)'; }
  };
  var tick = function () { measure(); ui(); atm(S.stage); fade(); };
  addEventListener('scroll', function () { tick(); kick(); }, { passive: true });
  addEventListener('resize', function () { tick(); kick(); });

      [0, 'Sinapsis', term], [0, 'Soma', [somaA[0], somaA[1] + .6, 0]]
    ].map(function (l) {
      var el = d.createElement('div'); el.className = 'ng-story__lbl'; el.innerHTML = '<span></span>'; el.firstChild.textContent = l[1]; lblBox.appendChild(el);
      return { k: l[0], el: el, v: new T.Vector3(l[2][0], l[2][1], l[2][2]) };
    });
    var tmp = new T.Vector3();

    /* --- Cámara y composición por etapa --- */
    var CAMZ = [12.5, 12.6, 12.8, 13, 12.2], OFFS = [3.2, 2.8, 3.1, 3.0, 3.3], ROTX = [.08, .02, .06, .28, .12], CAMY = [0, 0, .1, .25, .35];
    var cur = { stage: S.stage, alpha: mobile && S.text ? .24 : 1, off: 0, z: 12.5 }, mx = 0, my = 0, tmx = 0, tmy = 0;
    var ray = new T.Raycaster(), ndc = new T.Vector2(), plane = new T.Plane(), hit = new T.Vector3(), nrm = new T.Vector3(), mouseIn = 0, mouseT = 0;
    if (NG.fine) {
      addEventListener('pointermove', function (e) { tmx = e.clientX / innerWidth - .5; tmy = e.clientY / innerHeight - .5; ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); mouseIn = 1; kick(); }, { passive: true });
      d.addEventListener('pointerleave', function () { mouseIn = 0; });
    }
    var mousePick = function () {
      if (!mouseIn) return;
      ray.setFromCamera(ndc, camera);
      nrm.set(0, 0, 1).applyQuaternion(group.quaternion);
      plane.setFromNormalAndCoplanarPoint(nrm, group.position);
      if (ray.ray.intersectPlane(plane, hit)) { group.worldToLocal(hit); U.uMouse.value.lerp(hit, .25); }
    };
    var size = function () {
      var w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
      U.uPix.value = h * DPR * .5 / Math.tan(camera.fov * Math.PI / 360);
      mobile = !NG.fine || w < 768;
    };
    size(); addEventListener('resize', size);

    var time = 0, last = 0, raf = 0, running = true, settle = 0;
    var frame = function (now) {
      raf = 0;
      var dt = last ? Math.min(.05, (now - last) / 1000) : .016; last = now;
      if (!paused) time += dt;
      var ip = function (arr, s) { var i = Math.min(arr.length - 2, Math.floor(s)), f = s - i; return arr[i] + (arr[i + 1] - arr[i]) * f; };
      var k = paused ? 1 : 1 - Math.pow(1 - .085, dt * 60); // suavizado independiente de los FPS
      cur.stage += (S.stage - cur.stage) * k;
      var tgtAlpha = .28 + .72 * NG.clamp((S.focus - .12) / .45, 0, 1);
      if (mobile && S.text) tgtAlpha = Math.min(tgtAlpha, S.side > 1.1 ? .14 : .24); // en el hero móvil el titular ocupa toda la pantalla
      if (!mobile && S.side > 1.1 && innerWidth < 1200) tgtAlpha = Math.min(tgtAlpha, .6); // laptop: el titular del hero manda // en móvil, el texto manda: la escena baja a 35 %
      cur.alpha += (tgtAlpha - cur.alpha) * k;
      var tgtOff = mobile ? 0 : S.side * ip(OFFS, cur.stage);
      cur.off += (tgtOff - cur.off) * k * .8;
      var tz = ip(CAMZ, cur.stage);
      group.scale.setScalar(mobile ? .62 : 1);
      cur.z += (tz - cur.z) * k;
      mx += (tmx - mx) * .05; my += (tmy - my) * .05;
      U.uStage.value = cur.stage; U.uTime.value = time; U.uAlpha.value = cur.alpha; U.uFocus.value = cur.z;
      mouseT += ((mouseIn && cur.alpha > .6 ? 1 : 0) - mouseT) * .08; U.uMouseOn.value = mouseT;
      group.position.x = cur.off;
      group.rotation.y = Math.sin(time * .12) * .35 + mx * .25;
      if (cur.stage > 1.4 && cur.stage < 2.6) group.rotation.y *= .25; // el pasillo de servidores se mira de frente
      group.rotation.x = ip(ROTX, cur.stage) + my * .12;
      stars.rotation.y = time * .01;
      camera.position.set(mx * .4, ip(CAMY, cur.stage) - my * .3, cur.z);
      camera.lookAt(group.position.x * .25, ip(CAMY, cur.stage) * .6, 0);
      group.updateMatrixWorld(); mousePick();
      renderer.render(scene, camera);
      // Etiquetas: visibles solo cerca de su etapa y cuando la escena tiene el foco
      group.updateMatrixWorld();
      var hw = innerWidth / 2, hh = innerHeight / 2;
      LBL.forEach(function (l) {
        var on = Math.abs(cur.stage - l.k) < .22 && cur.alpha > .7;
        if (on) {
          tmp.copy(l.v).applyMatrix4(group.matrixWorld).project(camera);
          if (tmp.z > 1 || Math.abs(tmp.x) > 1.05 || Math.abs(tmp.y) > 1.05) on = false;
          else l.el.style.transform = 'translate(' + (tmp.x * hw + hw).toFixed(1) + 'px,' + (-tmp.y * hh + hh).toFixed(1) + 'px)';
        }
        if (l.on !== on) { l.on = on; l.el.classList.toggle('is-on', on); }
      });
      var moving = Math.abs(S.stage - cur.stage) > .002 || Math.abs(tgtAlpha - cur.alpha) > .002 || Math.abs(tgtOff - cur.off) > .002 || mouseT > .01;
      // Fuera de la historia (o tras el fundido final) se congela el último cuadro: sin rAF, GPU libre
      if (running && (storyVis || moving) && S.end < .999 && (!paused || moving)) raf = requestAnimationFrame(frame);
    };
    kick = function () { if (!raf && running) { last = 0; raf = requestAnimationFrame(frame); } };
    d.addEventListener('visibilitychange', function () { running = !d.hidden; kick(); });
    var storyVis = true;
    if ('IntersectionObserver' in window) {
      var seen = new Map(), io = new IntersectionObserver(function (es) {
        es.forEach(function (e) { seen.set(e.target, e.isIntersecting); });
        storyVis = false; seen.forEach(function (v) { if (v) storyVis = true; });
        kick();
      }, { rootMargin: '20% 0px' });
      chs().concat(hero ? [hero] : []).forEach(function (el) { io.observe(el); });
    }
    // Compila los shaders antes del primer cuadro y recién ahí retira el indicador de carga
    try { renderer.compile(scene, camera); } catch (e) {}
    requestAnimationFrame(function (t) { frame(t); layer.classList.add('is-on'); });
  }
});
</script>
