      if (running && (storyVis || moving) && S.end < .999 && (!paused || moving)) raf = requestAnimationFrame(frame);
    };
    kick = function () { if (!raf && running) { last = 0; raf = requestAnimationFrame(frame); } };

    }
    // Compila los shaders antes del primer cuadro y recién ahí retira el indicador de carga
    try { renderer.compile(scene, camera); } catch (e) {}
    requestAnimationFrame(function (t) { frame(t); layer.classList.add('is-on'); de.classList.add('ng-3d-live'); });
  }
});
