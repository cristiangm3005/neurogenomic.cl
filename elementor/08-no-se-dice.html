.ng-volt{color:var(--ng-volt)}
.ng-sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

background:var(--_bg);color:var(--_fg)!important;font:500 15px/1 var(--ng-ff);letter-spacing:-.005em;

}
.ng-btn{--_bd:rgba(255,255,255,.12)}

.ng-btn--volt{--_bg:var(--ng-lime);--_fg:#0A0B0D;--_bd:var(--ng-lime);font-weight:600;box-shadow:0 0 0 0 rgba(200,255,0,0),0 10px 34px -12px rgba(200,255,0,.55);transition:background .35s var(--ng-ease),border-color .35s var(--ng-ease),color .35s var(--ng-ease),box-shadow .45s var(--ng-ease)}

.ng-sec :focus-visible,.ng-nav :focus-visible,.ng-mast :focus-visible,.ng-foot :focus-visible,.ng-menu :focus-visible{outline:2px solid var(--ng-lime);outline-offset:3px;border-radius:2px}

}

    return 'rgba(255,42,0,1)';
  };
  NG.heat = function (cv, pts, opts) {
    opts = opts || {};
    var r = cv.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(1, r.width), h = Math.max(1, r.height);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    var base = Math.min(w, h), cell = opts.cell || Math.max(5, Math.round(base / 46)), gap = Math.max(1, cell * .18);
    var gain = opts.gain || 1;
    // brillo suave bajo los píxeles
    pts.forEach(function (p) {
      var rad = (p[2] || .12) * base * 1.25, x = p[0] * w, y = p[1] * h;
      var g = ctx.createRadialGradient(x, y, 0, x, y, rad);
      g.addColorStop(0, 'rgba(200,255,0,' + (.22 * (p[3] == null ? 1 : p[3])) + ')'); g.addColorStop(1, 'rgba(200,255,0,0)');
      ctx.fillStyle = g; ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    });
    for (var y = 0; y < h; y += cell) for (var x = 0; x < w; x += cell) {
      var cx = x + cell / 2, cy = y + cell / 2, v = 0;
      for (var i = 0; i < pts.length; i++) {
        var p = pts[i], s = (p[2] || .12) * base, dx = cx - p[0] * w, dy = cy - p[1] * h;
        v += (p[3] == null ? 1 : p[3]) * Math.exp(-(dx * dx + dy * dy) / (2 * s * s * .45));
      }
      v *= gain;
      if (v < .08) continue;
      ctx.fillStyle = NG.thermal(Math.min(1, v));
      ctx.fillRect(x + gap / 2, y + gap / 2, cell - gap, cell - gap);
    }
  };

  /* --- Contador ----------------------------------------------------- */
  NG.count = function (el, to, o) {
    o = o || {};
    var dec = o.dec || 0, fmt = function (v) { return (o.pre || '') + v.toFixed(dec) + (o.suf || ''); };
    if (NG.rm || !window.gsap) { el.textContent = fmt(to); o.done && o.done(); return; }
    var st = { v: o.from || 0 };
    el.textContent = fmt(st.v);
    return gsap.to(st, { v: to, duration: o.dur || 1.8, ease: o.ease || 'expo.out', delay: o.delay || 0,
      onUpdate: function () { el.textContent = fmt(st.v); o.update && o.update(st.v / to); },
      onComplete: function () { el.textContent = fmt(to); o.done && o.done(); } });
  };

  /* --- Reveals genéricos dentro de una sección ----------------------- */
  NG.reveals = function (root) {
    if (!window.gsap || NG.rm) return;
    root.querySelectorAll('[data-ng-split]').forEach(function (el) {
      var w = NG.split(el);
      gsap.from(w, { yPercent: 110, duration: 1.1, ease: 'expo.out', stagger: 0.05,
        scrollTrigger: { trigger: el, start: 'top 88%', once: true } });
    });
    root.querySelectorAll('[data-ng-reveal]').forEach(function (el) {
      gsap.from(el, { autoAlpha: 0, y: 28, duration: 1, ease: 'power3.out', delay: parseFloat(el.getAttribute('data-ng-reveal')) || 0,
        scrollTrigger: { trigger: el, start: 'top 90%', once: true } });
    });
    if (root.hasAttribute('data-ng-bg')) {
      gsap.timeline({ scrollTrigger: { trigger: root, start: 'top 75%', end: 'bottom 25%', scrub: true } })
        .fromTo(root, { '--ng-bgo': 0 }, { '--ng-bgo': 1, ease: 'none', duration: 0.25 })
        .to(root, { '--ng-bgo': 1, duration: 0.5 })
        .to(root, { '--ng-bgo': 0, ease: 'none', duration: 0.25 });
    }
  };

  /* --- Botones magnéticos ------------------------------------------- */
  NG.magnet = function (el, k) {
    if (!NG.fine || NG.rm || el._ngMag) return;
    el._ngMag = 1; k = k || 0.3;
    var inner = el.querySelector('.ng-btn__t') || el;
    el.addEventListener('pointermove', function (e) {
      var r = el.getBoundingClientRect();
      var x = (e.clientX - r.left - r.width / 2) * k, y = (e.clientY - r.top - r.height / 2) * k;
      el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
      if (inner !== el) inner.style.transform = 'translate(' + x * 0.35 + 'px,' + y * 0.35 + 'px)';
    });
    el.addEventListener('pointerleave', function () {
      el.style.transition = 'transform .6s cubic-bezier(.16,1,.3,1)';
      el.style.transform = ''; if (inner !== el) { inner.style.transition = el.style.transition; inner.style.transform = ''; }
      setTimeout(function () { el.style.transition = ''; inner.style.transition = ''; }, 600);
    });
  };

  /* --- Anclas internas con Lenis ------------------------------------ */
  d.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href*="#"]');
    if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey) return;
    var url = new URL(a.href, location.href);
    if (url.pathname !== location.pathname || !url.hash || url.hash.length < 2) return;
    var t = d.getElementById(decodeURIComponent(url.hash.slice(1)));
    if (!t) return;
    e.preventDefault();
    NG.scrollTo(t);
    if (t.tabIndex < 0 && !/^(A|BUTTON|INPUT|SELECT|TEXTAREA)$/.test(t.tagName)) t.setAttribute('tabindex', '-1');
    t.focus({ preventScroll: true });
    history.replaceState(null, '', url.hash);
  });
})();
</script>
<section class="ng-sec ng-said" aria-labelledby="ng-said-title" data-ng="said">
  <div class="ng-said__beam" aria-hidden="true"></div>
  <div class="ng-wrap">
    <div class="ng-said__grid">
      <div class="ng-said__copy">
        <p class="ng-mono ng-eyebrow" style="margin-bottom:clamp(18px,2vw,28px)">03 · Señal no consciente</p>
        <h2 class="ng-h2 ng-said__t" id="ng-said-title" data-ng-split>Lo que<br>no se dice<br><span class="ng-hl">sí se mide.</span></h2>
        <p class="ng-said__brand" aria-hidden="true">NEUROGENOMIC</p>
        <p class="ng-said__p" data-ng-reveal>Una encuesta recoge lo que la persona cree que siente. La mirada, el gesto y la piel registran lo que realmente pasa, antes de que lo pueda explicar.</p>
      </div>
      <div class="ng-said__stage">
        <figure class="ng-said__rec" aria-label="Registro sincronizado ilustrativo: la mirada, el rostro y la piel reaccionan antes de que la persona responda una pregunta.">
          <figcaption class="ng-said__rh"><span>Registro sincronizado · 0–8 s</span><b>Ilustrativo</b></figcaption>
          <canvas class="ng-said__cv" aria-hidden="true"></canvas>
          <div class="ng-said__ans"><span>Declarado</span><q class="ng-said__q">&nbsp;</q></div>
          <p class="ng-said__note">Demostración visual. No corresponde a datos de un estudio real.</p>
        </figure>
      </div>
    </div>
  </div>
</section>

<script>
NG.boot('[data-ng="said"]', function (sec) {
  var rec = sec.querySelector('.ng-said__rec'), q = sec.querySelector('.ng-said__q');
  var draw, cv = NG.canvas(sec.querySelector('.ng-said__cv'), function () { if (NG.rm && draw) draw(1); });
  NG.reveals(sec);
  /* Eventos ilustrativos de una sesión de 8 s. La respuesta declarada llega al final. */
  var T = 8, ANS = 6.3, SAY = 'Me da igual el envase.';
  var gaze = [[.25, .55, 'LOGO'], [.7, 1.25, 'ENVASE'], [1.4, 1.7, 'PRECIO'], [1.85, 2.9, 'ENVASE'], [3.05, 3.3, 'CLAIM'], [3.45, 4.4, 'ENVASE'], [4.6, 4.85, 'LOGO'], [5.0, 5.7, 'ENVASE']];
  var face = [[1.05, 'AU12', 'sonrisa'], [2.9, 'AU1+2', 'cejas ↑'], [4.6, 'AU12', 'sonrisa']];
  var skin = [[1.6, .55], [3.9, .9], [6.9, .3]];
  var rows = [['MIRADA', .14], ['ROSTRO', .40], ['PIEL', .66], ['DECLARADO', .9]];
  var LW = 0, typed = -1;
  draw = function (p) {
    var c = cv.ctx, w = cv.w, h = cv.h;
    LW = w < 420 ? 66 : 84;
    var x0 = LW, x1 = w - 6, X = function (t) { return x0 + (x1 - x0) * t / T; };
    var tt = p * T;
    c.clearRect(0, 0, w, h);
    c.font = '500 10px "IBM Plex Mono", monospace'; c.textBaseline = 'middle';
    // Rejilla de tiempo
    for (var s = 0; s <= T; s++) {
      c.strokeStyle = 'rgba(255,255,255,' + (s % 2 ? .04 : .08) + ')';
      c.beginPath(); c.moveTo(X(s) + .5, 0); c.lineTo(X(s) + .5, h - 16); c.stroke();
      if (s % 2 === 0) { c.fillStyle = 'rgba(160,165,176,.9)'; c.fillText(s + 's', X(s) - (s === T ? 16 : 0), h - 6); }
    }
    rows.forEach(function (r) {
      var y = r[1] * (h - 16);
      c.fillStyle = 'rgba(160,165,176,.95)'; c.fillText(r[0], 0, y);
      c.strokeStyle = 'rgba(255,255,255,.06)'; c.beginPath(); c.moveTo(x0, y + .5); c.lineTo(x1, y + .5); c.stroke();
    });
    var on = function (t) { return tt >= t; };
    // Mirada: fijaciones como barras (duración) con zona de interés
    var gy = rows[0][1] * (h - 16);
    gaze.forEach(function (g) {
      if (!on(g[0])) return;
      var e = Math.min(tt, g[1]), env = g[2] === 'ENVASE';
      c.fillStyle = env ? 'rgba(200,255,0,.85)' : 'rgba(242,243,240,.35)';
      c.fillRect(X(g[0]), gy - 6, Math.max(2, X(e) - X(g[0])), 12);
      if (env && tt > g[0] + .25 && (g[1] - g[0]) > .5) { c.fillStyle = 'rgba(10,11,13,.95)'; c.fillText(g[2], X(g[0]) + 4, gy + 1); }
    });
    // Rostro: marcadores de unidades de acción
    var fy = rows[1][1] * (h - 16);
    face.forEach(function (f) {
      if (!on(f[0])) return;
      var k = Math.min(1, (tt - f[0]) / .25), x = X(f[0]);
      c.save(); c.translate(x, fy); c.rotate(Math.PI / 4); c.scale(k, k);
      c.fillStyle = '#C8FF00'; c.fillRect(-5, -5, 10, 10); c.restore();
      c.fillStyle = 'rgba(242,243,240,' + (.85 * k) + ')'; c.fillText(f[1], x + 10, fy - 9);
      if (w > 360) { c.fillStyle = 'rgba(160,165,176,' + (.9 * k) + ')'; c.fillText(f[2], x + 10, fy + 9); }
    });
    // Piel: inicio de respuesta electrodérmica (SCR) como espigas
    var sy = rows[2][1] * (h - 16), sh = (rows[2][1] - rows[1][1]) * (h - 16) * .8;
    skin.forEach(function (k) {
      if (!on(k[0])) return;
      var a = Math.min(1, (tt - k[0]) / .5), x = X(k[0]), H = sh * k[1] * a;
      c.strokeStyle = 'rgba(200,255,0,.9)'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(x, sy); c.lineTo(x, sy - H); c.stroke(); c.lineWidth = 1;
      c.beginPath(); c.arc(x, sy - H, 3, 0, 6.283); c.fillStyle = '#C8FF00'; c.fill();
      if (k[1] > .5) { c.fillStyle = 'rgba(242,243,240,' + (.85 * a) + ')'; c.fillText('SCR', x + 7, sy - H + 2); }
    });
    // Declarado: un solo evento, tarde
    var dy = rows[3][1] * (h - 16);
    if (on(ANS)) {
      c.fillStyle = 'rgba(242,243,240,.9)'; c.fillRect(X(ANS), dy - 6, Math.max(2, X(Math.min(tt, ANS + 1.2)) - X(ANS)), 12);
      // Brecha: señales previas vs. respuesta
      c.setLineDash([3, 4]); c.strokeStyle = 'rgba(200,255,0,.55)';
      c.beginPath(); c.moveTo(X(1.05), dy); c.lineTo(X(ANS) - 6, dy); c.stroke(); c.setLineDash([]);
      c.fillStyle = 'rgba(200,255,0,.9)'; c.fillText('señales previas', X(1.05), dy - 11);
    }
    // Cabezal
    c.fillStyle = 'rgba(200,255,0,.9)'; c.fillRect(X(tt), 0, 1.5, h - 16);
    // Respuesta tipeada
    var n = tt < ANS ? 0 : Math.min(SAY.length, Math.floor((tt - ANS) / 1.1 * SAY.length));
    if (n !== typed) { typed = n; q.textContent = n ? '«' + SAY.slice(0, n) + (n === SAY.length ? '»' : '') : '\u00a0'; q.classList.toggle('is-typing', tt >= ANS && n < SAY.length); }
  };
  if (NG.rm) { draw(1); return; }
  var t0 = null, HOLD = 2.2;
  NG.loop(rec, function (t) {
    if (t0 === null) t0 = t;
    var e = ((t - t0) / 1000) % (T + HOLD);
    draw(Math.min(1, e / T));
  });
  NG.ready().then(function (gsap) {
    if (!gsap) return;
    gsap.fromTo(rec, { autoAlpha: 0, y: 60 }, { autoAlpha: 1, y: 0, duration: 1.4, ease: 'expo.out', scrollTrigger: { trigger: rec, start: 'top 85%', once: true, onEnter: function () { t0 = null; } } });
  });
});
</script>
